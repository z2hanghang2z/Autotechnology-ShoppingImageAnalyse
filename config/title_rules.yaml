# 标题规则配置
# 所有可调参数集中在此，改规则不用改代码

# ---------- 长度规则 ----------
length:
  # 是否强制精确长度
  exact: true
  # 目标长度
  target: 100
  # 计数方式（用户要求：1 个汉字 = 2 字符，1 个英文/数字/符号 = 1 字符）
  #   taobao —— 汉字算 2，其他算 1   ← 当前使用
  #   char   —— 每个字符都算 1
  # 注意：target 是「字符数」，在 taobao 口径下 100 字符约等于 50 个汉字
  count_mode: taobao
  # 允许的长度浮动（exact=true 时忽略）
  tolerance: 0

# ---------- 机型关键词规则 ----------
model_keyword:
  # 整个标题中，机型关键词只允许出现一次
  once_only: true
  # 机型规范化映射（小写输入 → 标准写法）
  normalize:
    iphone: iPhone
    ipad: iPad
  # 识别机型的正则（用于从模型输出中剥离，避免重复出现）
  detect_patterns:
    - "iPhone\\s?\\d+\\s?(Pro\\s?Max|Pro|Plus|Mini|Max|SE|e|Air|Duo|U)?"
    - "苹果"
    - "iPhone"
    - "ipad"
    - "iPad"
    - "三星"
    - "华为"
    - "小米"
    - "OPPO"
    - "vivo"
    - "荣耀"
    - "折叠屏"

# ---------- 结构组装顺序 ----------
# 说明（对齐真实生产标题的写法）：
#   1. 机型来自表格的「机型列」（默认 D 列），第一个带「苹果」、第二个带「iPhone」、
#      其余裸写，**穿插在属性词之间**，既覆盖全机型搜索词又不显堆砌
#   2. 三个必填词拆开分布：手机壳约 22% 位置、新款约 48%、防摔约 74%
#   3. 固定段（承载必填词）无论怎么排都不会丢
#
# 可用槽位：
#   model_0       —— 适用于苹果{第1个机型}（提供「苹果」）
#   model_1       —— iPhone{第2个机型}（提供「iPhone」）
#   model_n       —— 裸机型，按出现顺序依次取第 3、4、5… 个
#   core_word     —— 手机壳
#   new_word      —— 新款
#   protect_word  —— 防摔
#   material      —— 材质词
#   feature       —— 条件特征词（如磁吸magsafe、支架）
#   keywords / keywords_a / keywords_b —— 模型特征词 + 运营词库
#   padding       —— 补足词（永远放最后，用于凑满长度）
structure:
  # 组装模板：按行轮换（第 1 行用第 1 个，第 2 行用第 2 个……循环）
  #
  # ★ 硬性要求：任何两个机型槽位之间**必须隔开**（至少夹一个关键词槽位），
  #   否则机型会连成一串（如「适用于苹果18iPhone1716ProMax手机壳…」）。
  #   写新模板时务必遵守这条。
  patterns:
    # 1 机型穿插式（最贴近真实写法）
    - [model_0, keywords_a, core_word, model_1, keywords_b, model_n, keywords_a,
       model_n, new_word, keywords_b, model_n, protect_word, keywords_a, model_n,
       feature, material, padding]

    # 2 机型穿插 · 核心词后置
    - [model_0, keywords_a, model_1, keywords_b, model_n, keywords_a, core_word,
       model_n, keywords_b, new_word, model_n, protect_word, keywords_a, model_n,
       feature, material, padding]

    # 3 属性词前置
    - [keywords_a, model_0, keywords_b, model_1, core_word, model_n, keywords_a,
       new_word, model_n, keywords_b, protect_word, model_n, keywords_a, model_n,
       feature, material, padding]

    # 4 机型夹心
    - [model_0, keywords_a, model_1, core_word, keywords_b, model_n, new_word,
       keywords_a, model_n, protect_word, keywords_b, model_n, keywords_a,
       feature, material, padding]

    # 5 核心词靠前 · 机型穿插
    - [model_0, keywords_a, core_word, model_1, new_word, keywords_b,
       protect_word, model_n, keywords_a, model_n, keywords_b, model_n,
       keywords_a, model_n, feature, material, padding]

  # 兜底模板（配置有误或未启用轮换时使用）
  default_pattern: [model_0, keywords_a, core_word, model_1, keywords_b, new_word,
                    protect_word, model_n, keywords_a, model_n, keywords_b,
                    model_n, keywords_a, model_n, feature, material, padding]

  # 是否启用模板轮换
  rotate_patterns: true
  # 固定段内部顺序是否也参与轮换（进一步降低雷同感）
  rotate_segments: false

  # ★ 模型特征词的字符配额（占目标长度的百分比）
  # 模型看图输出的特征词（颜色/图案/风格）最多占这么多，
  # 剩下的长度留给运营词库（主推词/搜索词/卖点词/精准词）。
  # 设为 0 表示不限制，设为 15 表示最多占 15%（100 字符 → 15 字符）
  model_keyword_quota: 15

# ---------- 差异化策略（要求：商品名称尽量不要重复）----------
differentiation:
  enabled: true
  # 补足词跨商品不重复：同一批里，补足词用过就不再给下一个商品用
  avoid_repeat_padding: true
  # 关键词顺序按行轮换：不同行的关键词排列顺序不同，降低雷同感
  rotate_keywords: true
  # 生成后计算两两相似度并输出报告
  report_similarity: true
  # 相似度告警阈值（超过则标记提醒人工关注）
  similarity_warn: 0.85
  # 相似度严重阈值（超过则判定不合格）
  similarity_fail: 0.95

# ---------- 重复词控制 ----------
dedup:
  # 同一关键词在标题中不重复出现
  enabled: true
  # 除机型外，其他词最多出现的次数
  max_repeat: 1

# ---------- 校验开关 ----------
validate:
  check_length: true          # 长度是否精确（按 count_mode 口径）
  check_required: true        # 必填词是否齐全
  check_forbidden: true       # 是否含违禁词
  check_punctuation: true     # ★ 是否含标点符号（用户要求名称不能有标点，/ 也不行）
  check_model_once: true      # 机型是否只出现一次
  check_duplicate: true       # 是否有重复关键词

# ---------- 重试 ----------
retry:
  # 校验不通过时最多重写几次
  max_attempts: 3
  # 每次重试把上次的问题反馈给模型
  feed_back_errors: true
