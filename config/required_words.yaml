# 必填词词库
# 标题中必须出现的词，缺失即判定不合格
# 维护说明：直接增删列表项即可，代码无需改动

# ---------- 硬性必填词 ----------
# 每个词都必须在标题中至少出现一次
must_include:
  - 手机壳      # 核心类目词
  - 苹果        # 品牌词（要求1）
  - iPhone      # 品牌词（要求1）
  - 新款        # 要求3
  - 防摔        # 要求3

# ---------- 材质词（必须至少命中一个）----------
# 要求：商品名称必须包含手机壳材质
# 匹配规则：从商品资料（表格第一列）里按「最长命中」匹配，取不到才让模型看图判断
# 维护注意：越具体的词越要靠前写清楚，匹配时按长度优先
material_group:
  - 液态素皮
  - 液态硅胶
  - 软硅胶
  - 素皮
  - 皮革
  - 磨砂
  - 肤感
  - 玻璃
  - 亚克力
  - 硅胶
  - 金属
  - 硬壳
  - 软壳
  - 透明
  - TPU
  - PC

# ---------- 机型段模板 ----------
# {model} 会被替换为规范化后的机型
#
# 多机型时的分工（对齐真实生产标题的写法）：
#   第 1 个机型 → model_template        带「苹果」→ 满足「苹果」必填词
#   第 2 个机型 → model_template_iphone 带「iPhone」→ 满足「iPhone」必填词
#   第 3 个起   → 裸机型，不带前缀（穿插在属性词之间）
#
# 例：D 列写 iphone18/17/16/15/14
#   → 适用于苹果18 … iPhone17 … 16 … 15 … 14
model_template: "适用于苹果{model}"
model_template_iphone: "iPhone{model}"
# 机型来源列（表格中的列字母），可在运行时用 --model-col 覆盖
model_column: "D"

# ---------- 必填词（拆成独立槽位，便于机型穿插）----------
# 真实标题里这三个词分散在不同位置：手机壳约 22%、新款约 48%、防摔约 74%
core_word: "手机壳"
new_word: "新款"
protect_word: "防摔"

# 组合式写法（不做机型穿插时使用）
core_template: "新款手机壳防摔"

# ---------- 补充词池（模型输出不足目标长度时按顺序补足）----------
# 按重要性排序，越靠前越优先使用
# 维护注意：
#   1. 词条之间不要语义重复（如"全包镜头"与"镜头保护"会重复表达同一信息点）
#   2. 计数口径为「汉字=2字符、英文=1字符」，纯中文词长度都是偶数。
#      为能凑出任意长度的缺口，必须保留若干**含英文字符的词**（长度为奇数）。
#      带 ★ 的就是这类词，请勿全部删除，否则可能出现 1 个字符补不齐的情况。
padding_pool:
  - 全包镜头
  - 保护套
  - 超薄
  - 高级感
  - 男女款
  - 情侣款
  - 简约
  - 时尚
  - 个性
  - 创意
  - 网红
  - 潮牌
  - ins风        # ★ 长度 5（奇数）
  - 小众
  - 日系
  - 韩系
  - 可爱
  - 卡通
  - Q版          # ★ 长度 3（奇数）
  - 磨砂质感
  - 防指纹
  - 防刮花
  - 抗震
  - 防滑
  - 散热
  - 轻薄
  - 亲肤
  - 3D立体       # ★ 长度 6（含英文便于微调）
  - IP款         # ★ 长度 4
  - X元素        # ★ 长度 5（奇数）
  - Q萌          # ★ 长度 3（奇数）
  - Q弹          # ★ 长度 3（奇数）

# ---------- 四类运营词库 ----------
# 用途：标题在「模型特征词」之后、在「补足词池」之前，按优先级从这里取词填充。
# 优先级：主推词 → 搜索词 → 卖点词 → 精准词 → 补足词池（padding_pool）
# 维护说明：
#   1. 越靠前的类别越优先被用上
#   2. 同一个词只写一处即可，跨类别重复会自动去重
#   3. 词条不能含标点符号（商品名称禁止标点）
word_banks:
  # 类别的取用顺序（可调整先后）
  priority:
    - main_words
    - search_words
    - selling_words
    - precise_words

  # 主推词：最优先使用的核心卖点词
  # 注意：
  #   1. 材质类词不写这里（材质由 material_group 单独处理，避免重复）
  #   2. 「磁吸magsafe」不写这里 —— 由 conditional_words 按条件强制加入
  #   3. 「支架」「挂绳」这类**特征宣称词**也不写这里 ——
  #      写了就会无差别加到所有商品上，产品没这功能就是虚假宣传。
  #      它们由 conditional_words 按「资料/图片里确实有该特征」来判定。
  #   4. 单个词条不要超过 8 个字符，超长会被过滤掉
  main_words:
    - 透明
    - 全包
    - 超轻薄
    - 散热
    - 镜头全包
    - 旋转支架
    - 防指纹
    - 全包边

  # 搜索词：搜索量大的词
  search_words:
    - 新款外壳
    - 全包款
    - 情侣
    - 可爱
    - 波点
    - 高级感
    - 小众设计
    - 简约风
    - 潮牌
    - 少女心
    - 卡通图案
    - 国潮
    - 网红同款
    - 氛围感
    - 冷淡风

  # 卖点词：强调产品优势
  selling_words:
    - 防摔
    - 超火
    - 巨好看小众
    - 高颜值
    - 手感舒适
    - 防刮耐磨
    - 抗震
    - 防滑

  # 精准词：长尾精准流量
  precise_words:
    - 学生党
    - 情侣款
    - 男女款
    - 送礼首选
    - 日常百搭
    - 通勤必备
    - 拍照好看

# ---------- ★ 条件必含词 ----------
# 用途：商品具备某个特征时，标题中**必须**出现对应词。
#       与普通词库不同，这里是硬性的——一旦判定命中，就会作为固定段插入，
#       不会被长度控制挤掉。
# 判定来源（两者任一命中即算具备该特征）：
#   detect_in_data     —— 在商品资料（表格第一列）文本里找
#   detect_in_keywords —— 在视觉模型看图输出的关键词里找
# 维护说明：想新增一个特征（如「挂绳」「旋转」），照下面格式加一条即可。
conditional_words:
  # 磁吸：商品是磁吸的就带上「磁吸magsafe」
  - feature: 磁吸
    must_include: 磁吸magsafe
    detect_in_data: [磁吸, magsafe, Magsafe, 磁力, 磁吸壳, 磁吸款]
    detect_in_keywords: [磁吸, 磁力, 无线充, magsafe, Magsafe, 磁吸环]

  # 支架：商品带支架的就带上「支架」
  # 注意：「支点」是常见的内部叫法（如 H6-星钻支点壳），等同支架
  - feature: 支架
    must_include: 支架
    detect_in_data: [支架, 支点, 立式, 可立]
    detect_in_keywords: [支架, 支点, 可立, 立式, 折叠支架, 支撑]

  # 挂绳：商品带挂绳的就带上「带挂绳」
  - feature: 挂绳
    must_include: 带挂绳
    detect_in_data: [挂绳, 挂链, 吊绳, 手绳]
    detect_in_keywords: [挂绳, 挂链, 吊绳, 手绳]

# ---------- 奇偶补齐兜底 ----------
# 当缺口只剩 1 个字符、且词池里找不到长度为 1 的词时使用。
# 默认用空格（不可见、不影响阅读）。如需改成别的字符，改这里即可。
parity_filler: " "

# ---------- 英文片段白名单 ----------
# 用途：过滤模型自创的无意义英文串（实测模型会编出 timeLUCKYEH 这类假品牌名）。
# 规则：关键词里若出现长度 > max_ascii_run 的连续英文字母，
#       且该片段不在此白名单中，则整个关键词被丢弃。
ascii_filter:
  enabled: true
  max_ascii_run: 3
  whitelist:
    - ins
    - Q
    - D
    - D立体
    - TPU
    - PC
    - PU
    - UV
    - IP
    - MagSafe
    - magsafe
    - Pro
    - Plus
    - Mini
    - Max
    - Air
    - Ultra
    - Duo
    - SE
    - HD
    - LED
