# 必填词词库
# 标题中必须出现的词，缺失即判定不合格
# 维护说明：直接增删列表项即可，代码无需改动

# ---------- 硬性必填词 ----------
# 每个词都必须在标题中至少出现一次
#
# ⚠️ 品牌词（苹果 / iPhone / 华为…）**不写在这里**！
#    本类目已不只卖苹果壳，机型列里会出现华为等其它品牌。
#    若把「苹果」「iPhone」定为无条件必填词，华为商品会被强行塞进苹果字样
#    → 虚假品牌宣称 → 买家退货。
#    品牌词由下方 brands 表按**实际品牌**自动写入标题（见 brands.brand_words）。
must_include:
  - 手机壳      # 核心类目词
  - 新款        # 要求3
  - 防摔        # 要求3

# ---------- 材质词（必须至少命中一个）----------
# 要求：商品名称必须包含手机壳材质
# 匹配规则：从商品资料（表格第一列）里按「最长命中」匹配，取不到才让模型看图判断
# 维护注意：越具体的词越要靠前写清楚，匹配时按长度优先
material_group:
  - 液态素皮
  - 液态硅胶
  - 软硅胶
  - 素皮
  - 皮革
  - 磨砂
  - 肤感
  - 玻璃
  - 亚克力
  - 硅胶
  - 金属
  - 硬壳
  - 软壳
  - 透明
  - TPU
  - PC

# ---------- 品牌表（按品牌自动切换机型段写法）----------
#
# 背景：本类目不只卖苹果壳，机型列会出现华为等其它品牌。
#       品牌必须按**实际机型**判定，绝不能所有商品都写「苹果」。
#
# 判定方式：在机型列文本里找 aliases，命中即认定为该品牌；
#           都没命中则用 default_brand（苹果，兼容历史数据的裸机型写法如 18U）。
#
# 模板的分工（对齐真实生产标题的写法）：
#   title_template_single  只有 1 个机型时用（要一次带齐品牌词）
#   title_template         多个机型时，第 1 个机型用
#   title_template_2       多个机型时，第 2 个机型用
#   title_template_n       第 3 个起用（裸机型，穿插在属性词之间）
#
# 例（苹果，机型列写 iphone18/17/16/15/14）：
#   → 适用于苹果18 … iPhone17 … 16 … 15 … 14
# 例（苹果，机型列只写 iphoneDuo）：
#   → 适用于苹果iPhoneDuo（单机型要同时出现「苹果」「iPhone」）
# 例（华为，机型列写 华为puraXMax/华为puraXMax典藏版）：
#   → 适用华为PuraXMax … PuraXMax典藏版
brands:
  苹果:
    aliases: [苹果, iPhone, iphone, IPHONE, Iphone]
    # 单机型：一次把「苹果」「iPhone」都带上
    title_template_single: "适用于苹果iPhone{model}"
    title_template: "适用于苹果{model}"
    title_template_2: "iPhone{model}"
    title_template_n: "{model}"
    # 标题里承载该品牌的词
    brand_words: [苹果, iPhone]
    # 是否要求这些品牌词**必须出现**（苹果商品要求「苹果」「iPhone」都出现）
    require_brand_words: true

  华为:
    aliases: [华为, huawei, HUAWEI, Huawei, HW, hw]
    title_template_single: "适用华为{model}"
    title_template: "适用华为{model}"
    title_template_2: "{model}"
    title_template_n: "{model}"
    brand_words: [华为]
    require_brand_words: true

# 机型列里没写品牌时，默认按哪个品牌处理
default_brand: 苹果

# ---------- 机型后缀别名 ----------
# 把机型列里的简写展开成标准写法。
# 例：18pm → iPhone18ProMax、17p → iPhone17Pro
model_suffix_aliases:
  pm: ProMax
  p: Pro
  promax: ProMax
  pro: Pro
  plus: Plus
  mini: Mini
  max: Max
  air: Air
  ultra: Ultra
  duo: Duo
  se: SE
  u: U
  e: E

# 机型来源列（表格中的列字母），可在运行时用 --model-col 覆盖
model_column: "D"

# ---------- 必填词（拆成独立槽位，便于机型穿插）----------
# 真实标题里这三个词分散在不同位置：手机壳约 22%、新款约 48%、防摔约 74%
core_word: "手机壳"
new_word: "新款"
protect_word: "防摔"

# 组合式写法（不做机型穿插时使用）
core_template: "新款手机壳防摔"

# ---------- 补充词池（模型输出不足目标长度时按顺序补足）----------
# 按重要性排序，越靠前越优先使用
# 维护注意：
#   1. 词条之间不要语义重复（如"全包镜头"与"镜头保护"会重复表达同一信息点）
#   2. 计数口径为「汉字=2字符、英文=1字符」，纯中文词长度都是偶数。
#      为能凑出任意长度的缺口，必须保留若干**含英文字符的词**（长度为奇数）。
#      带 ★ 的就是这类词，请勿全部删除，否则可能出现 1 个字符补不齐的情况。
padding_pool:
  - 全包镜头
  - 保护套
  - 超薄
  - 高级感
  - 男女款
  - 情侣款
  - 简约
  - 时尚
  - 个性
  - 创意
  - 网红
  - 潮牌
  - ins风        # ★ 长度 5（奇数）
  - 小众
  - 日系
  - 韩系
  - 可爱
  - 卡通
  - Q版          # ★ 长度 3（奇数）
  - 磨砂质感
  - 防指纹
  - 防刮花
  - 抗震
  - 防滑
  - 散热
  - 轻薄
  - 亲肤
  - 3D立体       # ★ 长度 6（含英文便于微调）
  - IP款         # ★ 长度 4
  - X元素        # ★ 长度 5（奇数）
  - Q萌          # ★ 长度 3（奇数）
  - Q弹          # ★ 长度 3（奇数）

# ---------- 四类运营词库 ----------
# 用途：标题在「模型特征词」之后、在「补足词池」之前，按优先级从这里取词填充。
# 优先级：主推词 → 搜索词 → 卖点词 → 精准词 → 补足词池（padding_pool）
# 维护说明：
#   1. 越靠前的类别越优先被用上
#   2. 同一个词只写一处即可，跨类别重复会自动去重
#   3. 词条不能含标点符号（商品名称禁止标点）
word_banks:
  # 类别的取用顺序（可调整先后）
  priority:
    - main_words
    - search_words
    - selling_words
    - precise_words

  # 主推词：最优先使用的核心卖点词
  # 注意：
  #   1. 材质类词不写这里（材质由 material_group 单独处理，避免重复）
  #   2. 「磁吸magsafe」不写这里 —— 由 conditional_words 按条件强制加入
  #   3. 「支架」「挂绳」这类**特征宣称词**也不写这里 ——
  #      写了就会无差别加到所有商品上，产品没这功能就是虚假宣传。
  #      它们由 conditional_words 按「资料/图片里确实有该特征」来判定。
  #   4. 单个词条不要超过 8 个字符，超长会被过滤掉
  main_words:
    - 透明
    - 全包
    - 超轻薄
    - 散热
    - 镜头全包
    - 旋转支架
    - 防指纹
    - 全包边

  # 搜索词：搜索量大的词
  search_words:
    - 新款外壳
    - 全包款
    - 情侣
    - 可爱
    - 波点
    - 高级感
    - 小众设计
    - 简约风
    - 潮牌
    - 少女心
    - 卡通图案
    - 国潮
    - 网红同款
    - 氛围感
    - 冷淡风

  # 卖点词：强调产品优势
  selling_words:
    - 防摔
    - 超火
    - 巨好看小众
    - 高颜值
    - 手感舒适
    - 防刮耐磨
    - 抗震
    - 防滑

  # 精准词：长尾精准流量
  precise_words:
    - 学生党
    - 情侣款
    - 男女款
    - 送礼首选
    - 日常百搭
    - 通勤必备
    - 拍照好看

# ---------- ★ 条件必含词 ----------
# 用途：商品具备某个特征时，标题中**必须**出现对应词。
#       与普通词库不同，这里是硬性的——一旦判定命中，就会作为固定段插入，
#       不会被长度控制挤掉。
# 判定来源（两者任一命中即算具备该特征）：
#   detect_in_data     —— 在商品资料（表格第一列）文本里找
#   detect_in_keywords —— 在视觉模型看图输出的关键词里找
# 维护说明：想新增一个特征（如「挂绳」「旋转」），照下面格式加一条即可。
conditional_words:
  # ★ 迪士尼联名：A 列出现 IP 联名 / 迪士尼 字样时，标题必须带「迪士尼联名」
  #
  # 触发依据（实测 A 列路径形态）：
  #   Z:\1-产品图片\2-折叠\M1-云彩系列-中轴\02-IP联名\260729-缎带七宝+庄（迪士尼）+.Y\主图-梓涵
  #                                        ↑ 分类目录名        ↑ 具体联名款
  #
  # ⚠️ 注意：「IP联名」是路径里的**分类目录名**（02-IP联名）。
  #     当前该目录下全部是迪士尼联名，所以拿它当触发条件。
  #     若以后这个目录里出现**非迪士尼**的 IP（如三丽鸥、宝可梦、名侦探柯南），
  #     必须把「IP联名 / ip联名 / Ip联名」从 detect_in_data 里删掉、只保留「迪士尼」，
  #     否则会给非迪士尼商品扣上迪士尼的帽子 → 虚假品牌宣称 → 投诉/退货。
  #
  # 另：detect_in_keywords 故意留空 —— 图片里有卡通图案就判迪士尼风险太高，
  #     宁可漏加（少个卖点），不可错加（法律风险）。要启用请只填**明确**的迪士尼角色名。
  - feature: 迪士尼联名
    must_include: 迪士尼联名
    detect_in_data: [迪士尼, Disney, disney, DISNEY, IP联名, ip联名, Ip联名]
    detect_in_keywords: []

  # 磁吸：商品是磁吸的就带上「磁吸magsafe」
  - feature: 磁吸
    must_include: 磁吸magsafe
    detect_in_data: [磁吸, magsafe, Magsafe, 磁力, 磁吸壳, 磁吸款]
    detect_in_keywords: [磁吸, 磁力, 无线充, magsafe, Magsafe, 磁吸环]

  # 支架：商品带支架的就带上「支架」
  # 注意：「支点」是常见的内部叫法（如 H6-星钻支点壳），等同支架
  - feature: 支架
    must_include: 支架
    detect_in_data: [支架, 支点, 立式, 可立]
    detect_in_keywords: [支架, 支点, 可立, 立式, 折叠支架, 支撑]

  # 挂绳：商品带挂绳的就带上「带挂绳」
  - feature: 挂绳
    must_include: 带挂绳
    detect_in_data: [挂绳, 挂链, 吊绳, 手绳]
    detect_in_keywords: [挂绳, 挂链, 吊绳, 手绳]

# ---------- 奇偶补齐兜底 ----------
# 用户要求（2026-09-22）：**商品名称中绝不能有空格**，必须用中文或英文填满。
# 所以这里默认为空字符串 —— 不再往末尾塞空格。
#
# 那奇数缺口怎么补？由 `assemble_exact` 的**换词机制**解决：
#   汉字算 2、英文算 1，总长度存在奇偶约束。凑不出时不是塞空格，
#   而是换掉一个已用词（长度奇偶不同）来翻转总长度奇偶，再用补足词凑满。
#   见 `assemble_exact` 里的 trials（a/b/c 三类候选）。
#
# 只有在极少数情况下仍凑不满时，才会放弃并在校验里报「无法精确凑满目标长度」，
# 由重试机制换一批关键词再试 —— 宁可报错，也不往名称里塞空格。
parity_filler: ""

# ---------- 英文片段白名单 ----------
# 用途：过滤模型自创的无意义英文串（实测模型会编出 timeLUCKYEH 这类假品牌名）。
# 规则：关键词里若出现长度 > max_ascii_run 的连续英文字母，
#       且该片段不在此白名单中，则整个关键词被丢弃。
ascii_filter:
  enabled: true
  max_ascii_run: 3
  whitelist:
    - ins
    - Q
    - D
    - D立体
    - TPU
    - PC
    - PU
    - UV
    - IP
    - MagSafe
    - magsafe
    - Pro
    - Plus
    - Mini
    - Max
    - Air
    - Ultra
    - Duo
    - SE
    - HD
    - LED
