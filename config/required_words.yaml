# 必填词词库
# 标题中必须出现的词，缺失即判定不合格
# 维护说明：直接增删列表项即可，代码无需改动

# ---------- 硬性必填词 ----------
# 每个词都必须在标题中至少出现一次
must_include:
  - 手机壳      # 核心类目词
  - 苹果        # 品牌词（要求1）
  - iPhone      # 品牌词（要求1）
  - 新款        # 要求3
  - 防摔        # 要求3

# ---------- 材质词（必须至少命中一个）----------
# 要求：商品名称必须包含手机壳材质
# 匹配规则：从商品资料（表格第一列）里按「最长命中」匹配，取不到才让模型看图判断
# 维护注意：越具体的词越要靠前写清楚，匹配时按长度优先
material_group:
  - 液态素皮
  - 液态硅胶
  - 软硅胶
  - 素皮
  - 皮革
  - 磨砂
  - 肤感
  - 玻璃
  - 亚克力
  - 硅胶
  - 金属
  - 硬壳
  - 软壳
  - 透明
  - TPU
  - PC

# ---------- 机型段模板 ----------
# {model} 会被替换为规范化后的机型，例如 iPhone16
# 该段同时满足「苹果」「iPhone」两个必填词，并保证机型只出现一次
model_template: "适用苹果{model}"

# ---------- 核心词段 ----------
# 紧跟机型段之后，承载「新款」「手机壳」「防摔」三个必填词
core_template: "新款手机壳防摔"

# ---------- 补充词池（模型输出不足目标长度时按顺序补足）----------
# 按重要性排序，越靠前越优先使用
# 维护注意：
#   1. 词条之间不要语义重复（如"全包镜头"与"镜头保护"会重复表达同一信息点）
#   2. 计数口径为「汉字=2字符、英文=1字符」，纯中文词长度都是偶数。
#      为能凑出任意长度的缺口，必须保留若干**含英文字符的词**（长度为奇数）。
#      带 ★ 的就是这类词，请勿全部删除，否则可能出现 1 个字符补不齐的情况。
padding_pool:
  - 全包镜头
  - 保护套
  - 超薄
  - 高级感
  - 男女款
  - 情侣款
  - 简约
  - 时尚
  - 个性
  - 创意
  - 网红
  - 潮牌
  - ins风        # ★ 长度 5（奇数）
  - 小众
  - 日系
  - 韩系
  - 可爱
  - 卡通
  - Q版          # ★ 长度 3（奇数）
  - 磨砂质感
  - 防指纹
  - 防刮花
  - 抗震
  - 防滑
  - 散热
  - 轻薄
  - 亲肤
  - 3D立体       # ★ 长度 6（含英文便于微调）
  - IP款         # ★ 长度 4
  - X元素        # ★ 长度 5（奇数）
  - Q萌          # ★ 长度 3（奇数）
  - Q弹          # ★ 长度 3（奇数）

# ---------- 奇偶补齐兜底 ----------
# 当缺口只剩 1 个字符、且词池里找不到长度为 1 的词时使用。
# 默认用空格（不可见、不影响阅读）。如需改成别的字符，改这里即可。
parity_filler: " "

# ---------- 英文片段白名单 ----------
# 用途：过滤模型自创的无意义英文串（实测模型会编出 timeLUCKYEH 这类假品牌名）。
# 规则：关键词里若出现长度 > max_ascii_run 的连续英文字母，
#       且该片段不在此白名单中，则整个关键词被丢弃。
ascii_filter:
  enabled: true
  max_ascii_run: 3
  whitelist:
    - ins
    - Q
    - D
    - D立体
    - TPU
    - PC
    - PU
    - UV
    - IP
    - MagSafe
    - magsafe
    - Pro
    - Plus
    - Mini
    - Max
    - Air
    - Ultra
    - Duo
    - SE
    - HD
    - LED
