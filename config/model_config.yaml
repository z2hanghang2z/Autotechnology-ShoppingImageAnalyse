# 模型与推理配置
# 换模型/调参只改这里，所有脚本自动生效

model:
  # Ollama 模型名称（用 ollama list 查看）
  name: "qwen3.5:9b"
  # 服务地址
  base_url: "http://127.0.0.1:11434"

inference:
  # 温度：0.0 保证输出可复现（实测 0.1 会导致同一张图多次结果不同，破坏流水线幂等性）
  temperature: 0.0
  # 是否流式输出（批量处理建议 false，便于解析）
  stream: false
  # 单次请求超时（秒）
  timeout: 900
  # 并发数：实测甜点 3（峰值吞吐在 5，但单次耗时翻倍）（详见方案文档 §2.6）
  concurrency: 3
  # 思考模式：False 可提速约 8 倍且答案质量无损（详见方案文档 §2.8）
  # qwen3.5 等 thinking 模型必须显式关闭，否则推理过程会拖慢 8 倍
  think: false
  # 单次输出 token 上限：防止模型失控（实测曾出现单次 3881 tokens / 耗时 69s 的异常）
  num_predict: 900
  # 网络异常重试次数（实测 Ollama 服务可能中途崩溃，报 502/连接中断）
  max_retries: 3
  # 重试基础等待秒数（指数退避：2s, 4s, 8s）
  retry_backoff: 2

system_prompt: |
  你是一个商品图片识别助手。请只依据图片中真实可见的内容作答，
  看不清或无法判断的地方必须明确说"不确定"，严禁编造。
