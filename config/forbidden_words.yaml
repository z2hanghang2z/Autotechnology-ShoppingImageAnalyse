# 违禁词词库
# 标题中出现任一词即判定不合格，触发重写
# 维护说明：
#   1. 按类别分组，便于溯源与定期更新
#   2. 只列具体词组，不要列单个汉字（如"最"会误伤"最新款"）
#   3. 平台规则变化时，只需在此文件增删，代码无需改动

# ---------- 绝对化用语（广告法第九条）----------
absolute:
  - 最好
  - 最佳
  - 最强
  - 最优
  - 最低价
  - 最便宜
  - 最高级
  - 最先进
  - 第一品牌
  - 第一名
  - 全国第一
  - 全球第一
  - 顶级
  - 极致
  - 极品
  - 唯一
  - 独家
  - 绝无仅有
  - 史无前例
  - 前所未有
  - 万能
  - 100%
  - 百分之百
  - 全网最低
  - 世界级
  - 国家级
  - 王牌
  - 冠军
  - 销量第一

# ---------- 虚假/夸大宣传 ----------
fake_claim:
  - 永久
  - 永不
  - 终身
  - 一劳永逸
  - 包治
  - 根治
  - 药到病除
  - 立竿见影
  - 无效退款

# ---------- 医疗功效（非医疗类目禁止）----------
medical:
  - 治疗
  - 药用
  - 医用
  - 杀菌
  - 消炎
  - 抗菌
  - 消毒
  - 抗病毒
  - 保健

# ---------- 品牌侵权/误导 ----------
infringement:
  - 苹果官方
  - 官方授权
  - 官方正品
  - 原装正品
  - 正品保证
  - 专柜正品
  - 原厂
  - 授权店
  # 授权类宣称：无授权证明即为违规（实测模型会自行写出"迪士尼授权正版"）
  - 授权
  - 正版
  - 授权正版
  - 官方联名
  - 联名正版
  - 独家授权

# ---------- 敏感/规避类 ----------
sensitive:
  - 高仿
  - 精仿
  - 复刻
  - 山寨
  - 水货
  - 免税
  - 代购
  - 内供
  - 特供
  - 专供

# ---------- 水印/店铺标识（实测模型会误当商品属性）----------
watermark:
  - wf
  - wj
  - 店铺
  - 专营店
  - 旗舰店

# ---------- 不相关类目词（防止串味）----------
# 注意：「支架」不在此列 —— 支架款（支点壳）是本类目的正常卖点，
#       已作为「条件必含词」配置在 required_words.yaml 的 conditional_words 中。
off_topic:
  - 钢化膜
  - 充电器
  - 数据线
  - 耳机
  - 贴膜
